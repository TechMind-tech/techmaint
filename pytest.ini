[pytest]
# -q por padrao; --strict-markers evita marcador digitado errado.
addopts = -q --strict-markers -ra
testpaths = tests
markers =
    e2e: testes de navegador (Playwright + chromium); rode so eles com `pytest -m e2e`
    lento: testes demorados (concorrencia, fuzz); exclua com `pytest -m "not lento"`
timeout = 120
filterwarnings =
    ignore::DeprecationWarning
